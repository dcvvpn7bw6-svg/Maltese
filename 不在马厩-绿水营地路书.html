<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自驾路书 · 可编辑模板</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --green:#1d4a2c; --green2:#2a6136; --gold:#c8952f; --coral:#c83c2d;
  --blue:#2f7d95; --paper:#f6f7f3; --ink:#22331f; --sub:#8fa383;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.7}

/* ---------- 顶部 ---------- */
header{background:linear-gradient(135deg,#1d4a2c 0%,#2a6136 70%,#387046 100%);
  color:#fff;padding:26px 34px 20px}
header h1{font-size:26px;letter-spacing:3px;margin-bottom:6px}
header .sub{font-size:13px;color:#d6e2d0;letter-spacing:1px}
.chips{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.35);
  border-radius:20px;padding:4px 16px;font-size:12.5px;letter-spacing:1px}
.chip b{color:#ffd98a}

/* ---------- 编辑条 ---------- */
.editbar{background:#241f12;color:#f0e6cf;font-size:12.5px;
  padding:9px 34px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.editbar .dot{width:8px;height:8px;border-radius:50%;background:#d9b355;
  box-shadow:0 0 8px #d9b355;flex:none}
.editbar code{background:rgba(255,255,255,.14);padding:1px 7px;border-radius:4px;
  font-family:Consolas,Monaco,monospace;font-size:12px}
.editbar button{background:#d9b355;color:#241f12;border:0;border-radius:5px;
  padding:4px 14px;font-size:12px;font-weight:700;cursor:pointer}
.editbar button:hover{background:#e8c76e}

/* ---------- 地图 ---------- */
#map{height:580px;width:100%;border-bottom:4px solid var(--gold);
  background:#e8ede4}
.map-note{background:#eef4ea;border-bottom:1px solid #dfe7d8;
  padding:7px 34px;font-size:12px;color:#6b7f63}

/* ---------- 主体 ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 44px}
.section-t{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.section-t .bar{width:6px;height:26px;background:var(--gold);border-radius:3px}
.section-t h2{font-size:19px;color:var(--green);letter-spacing:2px}
.section-t .cnt{margin-left:auto;font-size:12.5px;color:var(--sub)}

.stops{display:flex;flex-direction:column;gap:16px}
.stop{background:#fff;border:1px solid #dfe7d8;border-left:6px solid var(--green2);
  border-radius:10px;padding:16px 20px;display:flex;gap:18px;align-items:flex-start;
  box-shadow:0 1px 4px rgba(40,70,40,.06)}
.stop.start{border-left-color:var(--coral)}
.stop.stoptype{border-left-color:var(--blue)}
.stop.end{border-left-color:var(--gold)}
.no{flex:0 0 44px;height:44px;border-radius:50%;background:var(--green2);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.stop.start .no{background:var(--coral)}
.stop.end .no{background:var(--gold)}
.stop.stoptype .no{background:var(--blue)}
.info{flex:1;min-width:0}
.info h3{font-size:16.5px;color:var(--green);margin-bottom:3px}
.info h3 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:8px}
.info .desc{font-size:13px;color:#4a5a44;line-height:1.75;margin-top:6px}
.time{display:inline-block;background:#eef4ea;color:var(--green2);border-radius:12px;
  font-size:12px;padding:2px 12px;margin-top:8px;font-weight:700;letter-spacing:1px}
.photo{flex:0 0 168px;height:118px;border:2px dashed #c3d0ba;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#9fb094;font-size:12px;gap:3px;background:#fafcf8;text-align:center;
  overflow:hidden;cursor:pointer;transition:.18s}
.photo:hover{border-color:var(--gold);background:#fffdf6}
.photo .ic{font-size:24px}
.photo img{width:100%;height:100%;object-fit:cover}

/* ---------- 沿途影像（照片墙） ---------- */
.gallery{margin-top:34px;display:grid;grid-template-columns:repeat(3,1fr);
  grid-auto-rows:214px;gap:14px}
/* 成组大图：横跨两列，用于放最出片的一张 */
.gallery .shot.wide{grid-column:span 2}
.shot{position:relative;border-radius:11px;overflow:hidden;background:#fff;
  border:1px solid #dfe7d8;box-shadow:0 1px 5px rgba(40,70,40,.08);
  display:flex;flex-direction:column}
.shot .frame{flex:1;min-height:0;display:flex;align-items:center;
  justify-content:center;color:#9fb094;font-size:12px;gap:4px;text-align:center;
  background:repeating-linear-gradient(45deg,#fafcf8,#fafcf8 12px,#f4f8f0 12px,#f4f8f0 24px);
  border-bottom:2px dashed #d9e3d2}
.shot .frame .ic{font-size:26px;display:block;margin-bottom:2px}
.shot .frame img{width:100%;height:100%;object-fit:cover;display:block}
.shot .cap{padding:8px 13px 9px;font-size:12.5px;color:#3c4d36;line-height:1.5;
  background:#fff}
.shot .cap b{display:block;font-size:13px;color:var(--green);margin-bottom:1px}
.shot .cap .geo{font-size:11px;color:#93a389;letter-spacing:.3px}
.shot .tag{position:absolute;left:10px;top:10px;background:rgba(29,74,44,.86);
  color:#fff;font-size:11px;border-radius:12px;padding:2px 10px;
  letter-spacing:.5px;backdrop-filter:blur(2px)}
/* 跨列大图上的图注压在地图上方更紧凑 */
.shot.wide .cap{position:absolute;left:0;right:0;bottom:0;background:none;
  background:linear-gradient(transparent,rgba(12,26,16,.82));color:#fff}
.shot.wide .cap b{color:#fff}
.shot.wide .cap .geo{color:#cfe0c4}

/* ---------- 提示卡 ---------- */
.tips{margin-top:34px}
.tip-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tip{border-radius:10px;padding:13px 16px;font-size:13px;line-height:1.7;
  background:#fdf6e8;border:1px solid #e8d5a8;color:#5a4a2a}
.tip.warn{background:#fdf0ee;border-color:#e6b8b0;color:#6a3a30}
.tip b{display:block;margin-bottom:2px}

/* ---------- 表格 ---------- */
.tblwrap{margin-top:34px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;
  border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(40,70,40,.07)}
th{background:var(--green2);color:#fff;padding:10px 13px;text-align:left;
  font-weight:700;letter-spacing:.5px;white-space:nowrap}
td{padding:9px 13px;border-top:1px solid #e5ebe0;color:#4a5a44;vertical-align:top}
tr:nth-child(even) td{background:#f8faf6}

footer{text-align:center;color:var(--sub);font-size:11.5px;padding:20px;
  border-top:1px solid #e2e8dc;letter-spacing:1px;line-height:1.9;margin-top:30px}

/* ---------- 地图图钉（emoji 版） ---------- */
.pin-wrap{position:relative}
.pin{
  width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
}
.pin span{transform:rotate(45deg);font-size:19px;line-height:1;
  /* emoji 自带色彩，无需改色 */}

/* 常驻地名标签 */
.pin-label{
  position:absolute;left:50%;top:-52px;transform:translateX(-50%);
  white-space:nowrap;background:#fff;border:2px solid #2a6136;
  border-radius:14px;padding:3px 12px 4px;font-size:12.5px;font-weight:700;
  color:#1d4a2c;box-shadow:0 2px 6px rgba(0,0,0,.22);
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  letter-spacing:.4px;pointer-events:none;text-align:center;line-height:1.25;
}
/* 标签内的小字：行政区划 */
.pin-label .loc{
  display:block;font-size:10px;font-weight:400;color:#7d8f75;
  letter-spacing:.2px;margin-top:1px;
}
.pin-label::after{
  content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
  border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:7px solid #fff;
}
.pin-label.lbl-start{border-color:#c83c2d;color:#a82c1e}
.pin-label.lbl-end{border-color:#c8952f;color:#8a5a1a}
.pin-label.lbl-stop{border-color:#2f7d95;color:#1f5f74}

.leaflet-popup-content-wrapper{border-radius:10px}
.leaflet-popup-content-wrapper{border-radius:10px}
.leaflet-popup-content{margin:12px 16px;font-size:13px;line-height:1.6}
.pk-title{font-weight:700;color:var(--green);font-size:14.5px}
.pk-sub{color:#8a7a55;font-size:12px;margin-bottom:5px}
.pk-photo{margin-top:8px;border-radius:6px;overflow:hidden;max-width:210px}
.pk-photo img{width:100%;display:block}
/* 弹窗内的附加区块 */
.pk-extra{margin-top:8px;padding:8px 10px;background:#f4f8f1;
  border-left:3px solid #c8952f;border-radius:5px;font-size:12px;line-height:1.55}
.pk-extra b{display:block;color:#1d4a2c;font-size:12.5px;margin-bottom:2px}
.pk-extra span{color:#4a5a44}

/* 卡片内的附加区块 */
.extra-box{margin-top:10px;padding:10px 14px;background:#f7faf5;
  border:1px solid #e2ead9;border-left:4px solid #c8952f;border-radius:7px}
.extra-box .ex-item + .ex-item{margin-top:9px;padding-top:9px;border-top:1px dashed #dde7d4}
.extra-box .ex-t{font-size:13px;font-weight:700;color:#1d4a2c;margin-bottom:2px}
.extra-box .ex-d{font-size:12.5px;color:#4a5a44;line-height:1.65}

@media (max-width:760px){
  .tip-grid{grid-template-columns:1fr}
  .stop{flex-wrap:wrap}
  #map{height:400px}
  .editbar{padding:9px 18px}
  header{padding:22px 18px 18px}
  .gallery{grid-template-columns:1fr 1fr;grid-auto-rows:150px}
  .gallery .shot.wide{grid-column:span 2}
}
@media print{
  .editbar,.map-note{display:none}
  #map{height:420px}
  body{background:#fff}
}
</style>
</head>

/* ============================================================================
 *  以下为渲染逻辑，一般不需要修改
 * ==========================================================================*/

const TYPE_META = {
  start: { color: "#c83c2d", cls: "start" },
  spot:  { color: "#2a6136", cls: "" },
  stop:  { color: "#2f7d95", cls: "stoptype" },
  end:   { color: "#c8952f", cls: "end" }
};

/* ---------- 页头 ---------- */
function renderHeader(){
  document.getElementById("h-title").textContent = CONFIG.title;
  document.getElementById("h-sub").textContent = CONFIG.subtitle;
  document.getElementById("h-chips").innerHTML =
    CONFIG.chips.map(c => `<span class="chip">${c}</span>`).join("");
  document.getElementById("map-note").textContent = CONFIG.mapNote;
}

/* ---------- 节点卡片 ---------- */
function renderStops(){
  const box = document.getElementById("stops");
  const spots = CONFIG.stops.filter(s => s.type === "spot").length;
  const stops = CONFIG.stops.filter(s => s.type === "stop").length;
  document.getElementById("stop-count").textContent =
    `共 ${CONFIG.stops.length} 个节点 · 其中途经/打卡 ${spots} 个 · 补给 ${stops} 个`;

  box.innerHTML = CONFIG.stops.map(s => {
    const m = TYPE_META[s.type] || TYPE_META.spot;
    const photo = s.photo
      ? `<div class="photo"><img src="${s.photo}" alt="${s.name}"></div>`
      : `<div class="photo"><span class="ic">📷</span>${s.name}照片<br>点此替换</div>`;
    const extra = (s.extra || []).length
      ? `<div class="extra-box">` + s.extra.map(e =>
          `<div class="ex-item"><div class="ex-t">${e.icon || ""} ${e.title}</div>
           <div class="ex-d">${e.text}</div></div>`).join("") + `</div>`
      : "";
    return `<div class="stop ${m.cls}">
      <div class="no">${s.label}</div>
      <div class="info">
        <h3>${s.icon || ""} ${s.name}<small>${s.sub || ""}</small></h3>
        <div class="desc">${s.desc || ""}</div>
        ${extra}
        ${s.time ? `<span class="time">${s.time}</span>` : ""}
      </div>
      ${photo}
    </div>`;
  }).join("");
}

/* ---------- 沿途影像 ---------- */
function renderPhotos(){
  const list = CONFIG.photos || [];
  const box = document.getElementById("gallery");
  const cnt = document.getElementById("photo-count");
  if (cnt) cnt.textContent = list.length
    ? `共 ${list.length} 张 · 照片与图注均可在 CONFIG 里替换` : "";
  if (!box) return;
  box.innerHTML = list.map(p => {
    const frame = p.src
      ? `<div class="frame"><img src="${p.src}" alt="${p.title || ""}"></div>`
      : `<div class="frame"><span class="ic">🖼️</span>待补 · 放入照片</div>`;
    const tag = p.tag ? `<span class="tag">${p.tag}</span>` : "";
    const cap = `<div class="cap"><b>${p.title || ""}</b>${p.text || ""}
      ${p.geo ? `<div class="geo">📍 ${p.geo}</div>` : ""}</div>`;
    return `<div class="shot${p.wide ? " wide" : ""}">${tag}${frame}${cap}</div>`;
  }).join("");
}

/* ---------- 提醒 ---------- */
function renderTips(){
  document.getElementById("tips").innerHTML = CONFIG.tips.map(t =>
    `<div class="tip ${t.tone === "warn" ? "warn" : ""}"><b>${t.title}</b>${t.text}</div>`
  ).join("");
}

/* ---------- 表格 ---------- */
function renderSegments(){
  document.getElementById("seg-tbody").innerHTML = CONFIG.segments.map(s =>
    `<tr><td><b style="color:#1d4a2c">${s.no}</b></td><td>${s.route}</td>
     <td>${s.dist}</td><td>${s.note}</td></tr>`
  ).join("");
}

/* ---------- 页脚 ---------- */
function renderFooter(){
  document.getElementById("footer").innerHTML = CONFIG.footer.join("<br>");
}

/* ---------- 地图 ---------- */
let map, markers = [];
function renderMap(){
  if (map) { map.remove(); markers = []; }
  map = L.map("map", { scrollWheelZoom: true });
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 17,
    attribution: "底图 © OpenStreetMap contributors · Esri"
  }).addTo(map);

  const line = CONFIG.stops.map(s => [s.lat, s.lng]);
  // 优先用真实路网轨迹；没有则退化为直连
  const routeLine = (typeof ROUTE_GEOM !== "undefined" && ROUTE_GEOM.length > 1)
    ? ROUTE_GEOM : line;

  if (routeLine.length > 1) {
    // 白色描边（下层）
    L.polyline(routeLine, { color:"#ffffff", weight:11, opacity:.6 }).addTo(map);
    // 金色主线 —— 沿实际道路
    L.polyline(routeLine, { color:"#c8952f", weight:5, opacity:.96, lineJoin:"round" }).addTo(map);
    // 虚线内层
    L.polyline(routeLine, { color:"#ffeebc", weight:1.6, dashArray:"9 11", opacity:.9 }).addTo(map);
  }

  CONFIG.stops.forEach(s => {
    const m = TYPE_META[s.type] || TYPE_META.spot;
    const icon = s.icon || "📍";
    const mapName = s.mapName || s.name;
    const lblCls = s.type === "start" ? "lbl-start"
                 : s.type === "end"   ? "lbl-end"
                 : s.type === "stop"  ? "lbl-stop" : "";
    // 名称 + 小字位置；图标 + 常驻标签
    const locLine = s.loc ? `<span class="loc">${s.loc}</span>` : "";
    const html = `<div class="pin-wrap">
        <div class="pin-label ${lblCls}">${mapName}${locLine}</div>
        <div class="pin" style="background:${m.color}"><span>${icon}</span></div>
      </div>`;
    const iconObj = L.divIcon({
      className: "",
      html,
      iconSize: [40, 40],
      iconAnchor: [20, 40],
      popupAnchor: [0, -40]
    });
    // 附加区块（如骑马、木屋住宿）
    const extraHtml = (s.extra || []).map(e =>
      `<div class="pk-extra"><b>${e.icon || ""} ${e.title}</b><span>${e.text}</span></div>`
    ).join("");
    const popup = `<div class="pk-title">${icon} ${s.name}</div>
      <div class="pk-sub">${s.sub || ""}${s.loc ? " · " + s.loc : ""}</div>${s.desc || ""}
      ${extraHtml}
      ${s.photo ? `<div class="pk-photo"><img src="${s.photo}"></div>` : ""}`;
    markers.push(L.marker([s.lat, s.lng], { icon: iconObj }).addTo(map).bindPopup(popup));
  });

  // 视野要留出标签空间
  const boundsPts = routeLine.length > 1 ? routeLine : line;
  if (boundsPts.length > 1) map.fitBounds(L.polyline(boundsPts).getBounds(), { padding: [78, 78] });
  else if (line.length === 1) map.setView(line[0], 12);
  else map.setView([46.5, 121.1], 9);
}
